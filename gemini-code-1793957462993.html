<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Звіт по випічці</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 15px; background-color: #f4f4f9; color: #333; }
        h2 { text-align: center; color: #444; }
        .item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #ddd; }
        .item label { font-size: 16px; font-weight: bold; }
        .item input { width: 70px; padding: 5px; font-size: 16px; text-align: center; border: 1px solid #ccc; border-radius: 5px; }
        .btn-submit { display: block; width: 100%; padding: 12px; font-size: 18px; font-weight: bold; color: white; background-color: #28a745; border: none; border-radius: 8px; margin-top: 20px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>🥐 Звіт за зміну</h2>
    <form id="bakery-form">
        <div id="items-list"></div>
        <button type="button" class="btn-submit" onclick="sendData()">Надіслати звіт</button>
    </form>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const items = [
            "Багет / Бантик", "Біскотті", "Бріош", "Булочка з яблуком", "Бур.булка", 
            "Ватрушка", "Вишня", "Галета", "Гарбузовий", "Капуста", "Картоха", 
            "Кекс морквяний", "Кекс шок.кап", "Кекси", "Кільця", "Курино грибні", 
            "Маковка", "Паляниці", "Персик", "Піца", "Рогалі", "Рулет яблучний", 
            "Сінабони", "Сосиска", "Сочніки", "Тарт вишня", "Тарт сникерс", 
            "Тертий", "Цукринка", "Шоколад", "Шоколод.печиво"
        ];

        const container = document.getElementById('items-list');

        items.forEach(item => {
            const div = document.createElement('div');
            div.className = 'item';
            div.innerHTML = `
                <label>${item}</label>
                <input type="number" id="${item}" placeholder="0" min="0">
            `;
            container.appendChild(div);
        });

        function sendData() {
            let result = {};
            items.forEach(item => {
                let val = document.getElementById(item).value;
                if (val && parseInt(val) > 0) {
                    result[item] = parseInt(val);
                }
            });

            if (Object.keys(result).length === 0) {
                alert("Будь ласка, введіть кількість хоча б для однієї позиції!");
                return;
            }

            tg.sendData(JSON.stringify(result));
            tg.close();
        }
    </script>
</body>
</html>
